<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Plan FPV video channels for several pilots without interference. Works offline.">
    <meta name="theme-color" content="#000000">
    <title>FPV Frequency Analyzer</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="matrix-overlay" aria-hidden="true">
        <canvas id="matrixCanvas"></canvas>
    </div>

    <header class="content-header">
        <h1>FPV Frequency Analyzer</h1>
        <p>Pick video channels for several pilots and see which ones will clash.</p>
    </header>

    <main class="content">
        <section class="content-block filter-container" aria-label="Filters">
            <h2 class="filter-title">Band Type Filter</h2>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" class="filter-checkbox" id="analogCheck" value="analog">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-text">Analog</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" class="filter-checkbox" id="digitalCheck" value="digital">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-text">Digital</span>
                </label>
            </div>
            <div class="pilots-control">
                <span id="pilotsLabel">Pilots</span>
                <button type="button" class="step-btn" id="pilotsMinus" aria-label="Fewer pilots">−</button>
                <output id="pilotsValue" aria-labelledby="pilotsLabel">4</output>
                <button type="button" class="step-btn" id="pilotsPlus" aria-label="More pilots">+</button>
            </div>
            <button type="button" class="analyze-btn" id="analyzeBtn" disabled>Analyze</button>
            <ul class="legend" aria-label="Colour legend">
                <li><span class="swatch interference-none"></span>Clear</li>
                <li><span class="swatch interference-low"></span>Low</li>
                <li><span class="swatch interference-medium"></span>Medium</li>
                <li><span class="swatch interference-high"></span>Conflict</li>
            </ul>
        </section>

        <section class="content-block frequency-table hidden" id="frequencyTable" aria-label="Channels" aria-live="off"></section>
    </main>

    <aside class="selection-panel hidden" id="selectionPanel" aria-label="Selected channels">
        <div class="panel-head">
            Active channels: <span id="panelCount">0/4</span>
        </div>
        <ul class="selected-channels-list" id="selectedList"></ul>
        <p class="panel-verdict" id="panelVerdict"></p>
        <div class="panel-actions">
            <button type="button" class="control-button" id="optimizeBtn">Optimize</button>
            <button type="button" class="control-button" id="clearBtn">Clear</button>
        </div>
    </aside>

    <button type="button" class="scroll-to-top" id="scrollTopBtn" aria-label="Scroll to top">↑</button>

    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
        <button type="button" class="modal-close" id="modalClose" aria-label="Close">×</button>
        <div class="modal-channel-name" id="modalName"></div>
        <div class="modal-frequency" id="modalFrequency"></div>
        <div class="modal-unit">MHz</div>
        <dl class="modal-info" id="modalInfo"></dl>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
